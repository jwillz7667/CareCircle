<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .inner-specular-highlight-tl-2px {
            box-shadow: inset 2px 2px 0px 0px rgba(255, 255, 255, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#79542b",
                        "surface-variant": "#e3e3e0",
                        "surface": "#faf9f7",
                        "tertiary-fixed-dim": "#efbd8a",
                        "outline": "#717974",
                        "surface-container": "#eeeeeb",
                        "on-primary-fixed-variant": "#2c4d40",
                        "inverse-surface": "#2f312f",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "outline-variant": "#c1c8c3",
                        "surface-bright": "#faf9f7",
                        "surface-dim": "#dadad8",
                        "primary-fixed": "#c5ebd9",
                        "on-tertiary-container": "#fffbff",
                        "background": "#faf9f7",
                        "on-primary-container": "#f5fff8",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#614018",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#b8c8dd",
                        "secondary-container": "#d1e1f7",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#394859",
                        "on-error-container": "#93000a",
                        "surface-tint": "#436558",
                        "inverse-primary": "#aacfbe",
                        "tertiary-container": "#956d40",
                        "surface-container-highest": "#e3e3e0",
                        "primary-container": "#597c6d",
                        "surface-container-high": "#e8e8e6",
                        "on-secondary-fixed": "#0d1d2c",
                        "inverse-on-surface": "#f1f1ee",
                        "primary-fixed-dim": "#aacfbe",
                        "secondary-fixed": "#d4e4f9",
                        "on-secondary-container": "#556476",
                        "on-surface": "#1a1c1b",
                        "primary": "#416355",
                        "on-tertiary-fixed": "#2c1700",
                        "tertiary-fixed": "#ffdcbc",
                        "on-primary-fixed": "#002117",
                        "on-background": "#1a1c1b",
                        "secondary": "#516072",
                        "on-surface-variant": "#414845",
                        "surface-container-low": "#f4f4f1"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "glass-padding": "8px",
                        "stack-gap": "16px",
                        "gutter-card": "12px",
                        "margin-main": "20px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "title-sm": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "body-md": ["Manrope"],
                        "body-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display-lg": ["34px", {"lineHeight": "41px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "title-sm": ["20px", {"lineHeight": "25px", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-md": ["15px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["17px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-margin-main flex flex-col">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-[40px] saturate-[150%] border-b border-on-surface/[0.05] h-16 flex items-center px-margin-main justify-between">
<button class="flex items-center text-primary active:scale-105 duration-300">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<span class="font-headline-md text-[18px] text-on-surface-variant">Step 2 of 3</span>
<div class="w-6"></div> <!-- Spacer for symmetry -->
</header>
<!-- Main Content Canvas -->
<main class="mt-24 px-margin-main flex-grow flex flex-col items-center">
<!-- Progress Indicator -->
<div class="w-full flex gap-2 mb-10">
<div class="h-1.5 flex-1 rounded-full bg-primary-fixed"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary-fixed"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Header Section -->
<div class="w-full mb-8">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">Tell us about her</h1>
<p class="font-body-lg text-on-surface-variant/80">All optional — only what helps your circle.</p>
</div>
<!-- Circular Photo Placeholder -->
<div class="relative mb-10">
<div class="w-32 h-32 rounded-full bg-surface-container-high border border-on-surface/[0.08] flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-[40px] text-primary/40" data-icon="photo_camera">photo_camera</span>
</div>
<button class="absolute bottom-0 right-0 w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white inner-specular-highlight-tl-2px shadow-lg active:scale-95 duration-200">
<span class="material-symbols-outlined text-[20px]" data-icon="add" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
<!-- Form Fields -->
<form class="w-full space-y-6">
<div class="space-y-4">
<!-- First Name -->
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1">First name</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-low border-transparent focus:border-primary-container focus:ring-0 rounded-2xl px-4 font-body-lg text-on-surface placeholder:text-on-surface-variant/40 transition-all" placeholder="e.g. Eleanor" type="text"/>
<div class="absolute inset-0 rounded-2xl pointer-events-none border border-on-surface/[0.05]"></div>
</div>
</div>
<!-- Last Name -->
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1">Last name</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-low border-transparent focus:border-primary-container focus:ring-0 rounded-2xl px-4 font-body-lg text-on-surface placeholder:text-on-surface-variant/40 transition-all" placeholder="e.g. Vance" type="text"/>
<div class="absolute inset-0 rounded-2xl pointer-events-none border border-on-surface/[0.05]"></div>
</div>
</div>
<!-- Date of Birth -->
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1">Date of birth</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-low border-transparent focus:border-primary-container focus:ring-0 rounded-2xl px-4 font-body-lg text-on-surface placeholder:text-on-surface-variant/40 transition-all" placeholder="MM / DD / YYYY" type="text"/>
<span class="material-symbols-outlined absolute right-4 text-on-surface-variant/60" data-icon="calendar_month">calendar_month</span>
<div class="absolute inset-0 rounded-2xl pointer-events-none border border-on-surface/[0.05]"></div>
</div>
</div>
<!-- Primary Conditions -->
<div class="group pt-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3 ml-1">Primary conditions</label>
<div class="flex flex-wrap gap-2">
<!-- Amber Multi-select Chips -->
<div class="px-4 py-2 rounded-full bg-tertiary-fixed text-on-tertiary-fixed border border-tertiary-container/20 flex items-center gap-2 font-label-caps active:scale-95 duration-200 cursor-pointer">
<span>Dementia</span>
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant border border-on-surface/[0.05] flex items-center gap-2 font-label-caps active:scale-95 duration-200 cursor-pointer">
<span>Diabetes</span>
</div>
<div class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant border border-on-surface/[0.05] flex items-center gap-2 font-label-caps active:scale-95 duration-200 cursor-pointer">
<span>Mobility</span>
</div>
<div class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant border border-on-surface/[0.05] flex items-center gap-2 font-label-caps active:scale-95 duration-200 cursor-pointer">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span>
<span>Add Condition</span>
</div>
</div>
</div>
</div>
</form>
<!-- Footer Actions -->
<div class="w-full mt-12 mb-6 space-y-4">
<button class="w-full h-16 bg-primary text-white rounded-full font-headline-md text-headline-md inner-specular-highlight-tl-2px shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center">
                Continue
            </button>
<button class="w-full py-2 text-center text-primary font-title-sm hover:opacity-70 transition-opacity">
                Skip for now
            </button>
</div>
</main>
<!-- Support Image for Setting Context -->
<section class="px-margin-main mt-4 mb-margin-main">
<div class="w-full aspect-[16/9] rounded-lg overflow-hidden border border-on-surface/[0.05]">
<img class="w-full h-full object-cover" data-alt="A warm and beautifully lit domestic setting featuring an elderly woman with silver hair smiling gently in a bright, modern living room filled with lush green plants. The soft morning sunlight streams through large windows, creating a serene and safe atmosphere with a warm cream and sage green color palette. The aesthetic is clean and dignified, emphasizing high-end residential care and a peaceful multi-generational household environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5UJ_TuBVt6r6cpS5f3SYzFUSNrqRVgwr-eW3ZZ4bCaSpibhYrMQBcMR581Dcn4DrDg9HElzhIQ2LEGuMkbw9sBBeUO1YOSsCbu2WBXu-F9jdRI-Htc1DdUi-nTJICmODjfLbA9fHKjKheGXd-43DIwtR9U3Y_-3tEFB2T9VpxZaASs4MhYRxig0yUcggBSwjn5XzCp8z8kMkQyrbmUpj_ttH21MmNdUoCsFXrjBxhC0Xw4WgvOaKK9Jr4YpYPEowaMVrQNFqgZXI"/>
</div>
</section>
</body></html>
