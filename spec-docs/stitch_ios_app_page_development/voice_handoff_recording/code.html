<style>.inner-specular-highlight-tl-2px {

    width: 4px;
    border-radius: 2px;

<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-hidden">
<!-- Background Content (Blurred Home Dashboard) -->
<main class="fixed inset-0 z-0 p-margin-main blur-xl scale-110">
<div class="max-w-md mx-auto space-y-stack-gap">
<!-- TopAppBar Placeholder -->
<div class="flex justify-between items-center h-16">
<div class="w-10 h-10 rounded-full bg-surface-container"></div>
<div class="font-display-lg text-primary">CareCircle</div>
<div class="w-10 h-10 rounded-full bg-surface-container"></div>
</div>
<!-- Bento Grid Mockup -->
<div class="grid grid-cols-2 gap-gutter-card">
<div class="col-span-2 h-48 bg-surface-container rounded-lg border border-on-surface/[0.05]"></div>
<div class="h-32 bg-surface-container rounded-lg border border-on-surface/[0.05]"></div>
<div class="h-32 bg-surface-container rounded-lg border border-on-surface/[0.05]"></div>
<div class="col-span-2 h-40 bg-surface-container rounded-lg border border-on-surface/[0.05]"></div>
</div>
</div>
</main>
<!-- Dark Overlay -->
<div class="fixed inset-0 bg-on-surface/10 z-10"></div>
<!-- Voice Recording Modal Sheet -->
<div class="fixed inset-x-0 bottom-0 top-12 z-50 flex flex-col justify-end items-center px-margin-main pb-margin-main">
<div class="w-full max-w-md h-full liquid-glass rounded-t-xl inner-specular-highlight-tl-2px flex flex-col border border-on-surface/[0.05] overflow-hidden">
<!-- Modal Handle -->
<div class="flex justify-center pt-3 pb-8">
<div class="w-10 h-1 rounded-full bg-on-surface/10"></div>
</div>
<!-- Content Header -->
<div class="px-margin-main text-center space-y-2">
<h1 class="font-display-lg text-display-lg text-on-surface">What happened?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Tell your circle what's going on with Mom.</p>
</div>
<!-- Center Content: Waveform & Timer -->
<div class="flex-1 flex flex-col items-center justify-center space-y-12">
<!-- Animated Sage Waveform -->
<div class="flex items-center justify-center gap-1.5 h-32 w-full px-12">
<div class="waveform-bar h-8"></div>
<div class="waveform-bar h-12"></div>
<div class="waveform-bar h-20"></div>
<div class="waveform-bar h-28"></div>
<div class="waveform-bar h-16"></div>
<div class="waveform-bar h-24"></div>
<div class="waveform-bar h-12"></div>
<div class="waveform-bar h-20"></div>
<div class="waveform-bar h-8"></div>
<div class="waveform-bar h-16"></div>
<div class="waveform-bar h-24"></div>
<div class="waveform-bar h-20"></div>
<div class="waveform-bar h-12"></div>
<div class="waveform-bar h-8"></div>
</div>
<!-- Timer -->
<div class="font-mono text-[40px] font-light tracking-tighter text-on-surface">
          0:24
        </div>
</div>
<!-- Action Controls -->
<div class="p-margin-main space-y-stack-gap">
<div class="flex items-center justify-between w-full px-6">
<!-- Cancel Button -->
<button class="flex flex-col items-center gap-2 group transition-all active:scale-95">
<div class="w-12 h-12 rounded-full border border-on-surface/10 flex items-center justify-center text-on-surface hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-[24px]">close</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Cancel</span>
</button>
<!-- Main Recording Button (Active State) -->
<div class="relative">
<div class="absolute inset-0 bg-primary/20 rounded-full scale-150 blur-xl opacity-60"></div>
<button class="relative w-24 h-24 bg-primary rounded-full inner-specular-highlight-tl-2px shadow-lg flex items-center justify-center transition-all active:scale-95 group">
<div class="w-8 h-8 bg-on-primary rounded-sm shadow-sm transition-transform group-hover:scale-110"></div>
</button>
</div>
<!-- Add Photo Button -->
<button class="flex flex-col items-center gap-2 group transition-all active:scale-95">
<div class="w-12 h-12 rounded-full border border-on-surface/10 flex items-center justify-center text-on-surface hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-[24px]">add_a_photo</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Add photo</span>
</button>
</div>
<!-- Confirm Send (Bottom Floating Action) -->
<div class="pt-8">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-title-sm text-title-sm shadow-md inner-specular-highlight-tl-2px flex items-center justify-center gap-3 active:scale-[0.98] transition-transform">
<span>Send to Circle</span>
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
<!-- Safe Area Spacer -->
<div class="h-8"></div>
</div>
</div>
<!-- Background Imagery (Internalized Detail) -->
<div class="hidden">

</div>
