<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#79542b",
                    "surface-variant": "#e3e3e0",
                    "surface": "#faf9f7",
                    "tertiary-fixed-dim": "#efbd8a",
                    "outline": "#717974",
                    "surface-container": "#eeeeeb",
                    "on-primary-fixed-variant": "#2c4d40",
                    "inverse-surface": "#2f312f",
                    "on-tertiary": "#ffffff",
                    "error": "#ba1a1a",
                    "outline-variant": "#c1c8c3",
                    "surface-bright": "#faf9f7",
                    "surface-dim": "#dadad8",
                    "primary-fixed": "#c5ebd9",
                    "on-tertiary-container": "#fffbff",
                    "background": "#faf9f7",
                    "on-primary-container": "#f5fff8",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed-variant": "#614018",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "secondary-fixed-dim": "#b8c8dd",
                    "secondary-container": "#d1e1f7",
                    "on-primary": "#ffffff",
                    "on-secondary-fixed-variant": "#394859",
                    "on-error-container": "#93000a",
                    "surface-tint": "#436558",
                    "inverse-primary": "#aacfbe",
                    "tertiary-container": "#956d40",
                    "surface-container-highest": "#e3e3e0",
                    "primary-container": "#597c6d",
                    "surface-container-high": "#e8e8e6",
                    "on-secondary-fixed": "#0d1d2c",
                    "inverse-on-surface": "#f1f1ee",
                    "primary-fixed-dim": "#aacfbe",
                    "secondary-fixed": "#d4e4f9",
                    "on-secondary-container": "#556476",
                    "on-surface": "#1a1c1b",
                    "primary": "#416355",
                    "on-tertiary-fixed": "#2c1700",
                    "tertiary-fixed": "#ffdcbc",
                    "on-primary-fixed": "#002117",
                    "on-background": "#1a1c1b",
                    "secondary": "#516072",
                    "on-surface-variant": "#414845",

            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "glass-padding": "8px",
                    "stack-gap": "16px",
                    "gutter-card": "12px",
                    "margin-main": "20px"
            },
            "fontFamily": {
                    "headline-md": ["Manrope"],
                    "display-lg": ["Manrope"],
                    "title-sm": ["Manrope"],
                    "label-caps": ["Manrope"],
                    "body-md": ["Manrope"],
                    "body-lg": ["Manrope"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "display-lg": ["34px", {"lineHeight": "41px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "title-sm": ["20px", {"lineHeight": "25px", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],

                    "body-lg": ["17px", {"lineHeight": "24px", "fontWeight": "400"}]

          },
        },
      }
    </script>
<style>
        .inner-specular-highlight-tl-2px {
            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.4);
        }
        .liquid-glass-sage {
            background: linear-gradient(135deg, rgba(65, 99, 85, 0.85) 0%, rgba(89, 124, 109, 0.95) 100%);
            backdrop-filter: blur(40px) saturate(150%);
        }
        .liquid-glass-coral {
            background: linear-gradient(135deg, rgba(186, 26, 26, 0.8) 0%, rgba(220, 38, 38, 0.9) 100%);
            backdrop-filter: blur(40px) saturate(150%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Shared Component Logic - Suppressed Tabs for Recipient) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-[40px] saturate-[150%] flex justify-between items-center px-margin-main h-20">
<h1 class="font-display-lg text-display-lg text-primary">CareCircle</h1>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined text-[32px]" data-icon="settings">settings</span>
</button>
</header>
<main class="flex-1 mt-24 px-margin-main pb-32 flex flex-col gap-8">
<!-- Greeting Section -->
<section class="mt-4">
<h2 class="font-display-lg text-[42px] leading-tight text-on-surface font-extrabold">Good morning, Eleanor</h2>
<p class="font-title-sm text-on-surface-variant mt-2">It is a beautiful Tuesday today.</p>
</section>
<!-- Family Interaction Card -->
<section class="relative group cursor-pointer active:scale-[0.98] transition-all duration-300">
<div class="rounded-xl overflow-hidden border border-on-surface/[0.08] bg-surface-container-lowest">
<div class="aspect-[4/3] w-full relative">
<img class="w-full h-full object-cover" data-alt="A heartwarming, high-resolution photograph of a young woman with a kind smile, captured in soft, natural morning sunlight outdoors. The scene is bright and airy with a warm cream and sage green aesthetic, reflecting a peaceful and supportive family atmosphere. The background is a gently blurred garden, emphasizing a sense of tranquility and connection within the CareCircle brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBTjqmNQ4hp_bDsOmcQ1RYFWiPeaorzoRvn520aPQWsVGu25IECS7Y0lv6yBgNhDVMtTqvMvFG_XCxartbKOYeqiNcpkl61b1QSj99kYC5RZ6Ws-FgvbE_VA57mJDObxdRCmPr_2626xGFVOE2PqUyGRFkEY1niJR18l_bccGuDvEhiaCiRGg5m6S55B3P64nwj4flh_CoPMKWWLrfB80k2uzgP5xmg9JIW4pmuysDYZ6wdAEbTQbSjpkdQOG104QNxzkYC2L5NvqM"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
<div class="absolute bottom-6 left-6 right-6">
<p class="text-white font-title-sm text-[22px] leading-snug">Sarah sent you a note — <span class="underline decoration-2">tap to see</span></p>
</div>
</div>
</div>
</section>
<!-- Primary Action Buttons (Huge Tap Targets) -->
<section class="flex flex-col gap-6">
<!-- Medication Confirmation -->
<button class="w-full h-[160px] liquid-glass-sage rounded-xl inner-specular-highlight-tl-2px flex items-center px-10 gap-8 shadow-lg active:scale-95 transition-all duration-200">
<div class="w-20 h-20 rounded-full bg-white/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-white" data-icon="medical_services">medical_services</span>
</div>
<div class="text-left">
<span class="text-white font-headline-md text-[34px] block font-bold">I took my meds</span>
<span class="text-white/80 font-body-md text-[18px]">Tap when you are done</span>
</div>
</button>
<!-- Emergency/Family Contact -->
<button class="w-full h-[160px] liquid-glass-coral rounded-xl inner-specular-highlight-tl-2px flex items-center px-10 gap-8 shadow-lg active:scale-95 transition-all duration-200">
<div class="w-20 h-20 rounded-full bg-white/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-white" data-icon="call" style="font-variation-settings: 'FILL' 1;">call</span>
</div>
<div class="text-left">
<span class="text-white font-headline-md text-[34px] block font-bold">Call Sarah for help</span>
<span class="text-white/80 font-body-md text-[18px]">Tap to start a phone call</span>
</div>
</button>
</section>
<!-- Status Context -->
<div class="bg-surface-container-low p-6 rounded-lg border border-on-surface/[0.05] flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-3 h-3 rounded-full bg-primary animate-pulse"></div>
<span class="font-body-lg font-semibold text-on-surface">Family is online</span>
</div>
<span class="font-label-caps text-on-surface-variant">Last seen 10m ago</span>
</div>
</main>
<!-- Navigation Suppressed for Recipient Focus -->
<!-- FABs Suppressed for Transactional Focus -->
</body></html>
