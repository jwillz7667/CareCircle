name: iOS

on:
  pull_request:
    paths:
      - "CareCircle/**"
      - "CareCircle.xcodeproj/**"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "CareCircle/**"
      - "CareCircle.xcodeproj/**"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build-only CI job: a generic simulator destination avoids pinning to a
  # specific device/runtime that may not be preinstalled on the runner image.
  DESTINATION: generic/platform=iOS Simulator
  SCHEME: CareCircle

jobs:
  lint:
    name: Lint (swiftformat + swiftlint)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/swiftformat
            /opt/homebrew/Cellar/swiftlint
          key: brew-${{ runner.os }}-swift-${{ hashFiles('.swiftformat', '.swiftlint.yml') }}

      - name: Install tools
        run: |
          # The Homebrew cache restores the Cellar kegs but not the bin
          # symlinks, so a cache hit leaves swiftformat/swiftlint installed but
          # unlinked — `brew install` then no-ops without relinking and the
          # binaries are absent from PATH. Link explicitly, then verify both
          # resolve so any genuine failure surfaces here, not as a later 127.
          brew install swiftformat swiftlint || true
          brew link --overwrite swiftformat || true
          brew link --overwrite swiftlint || true
          swiftformat --version
          swiftlint version

      - name: swiftformat --lint
        run: swiftformat --lint .

      - name: swiftlint --strict
        run: swiftlint --strict --reporter github-actions-logging

  build:
    name: Build (xcodebuild)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select latest Xcode 26
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ runner.os }}-${{ hashFiles('CareCircle.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-${{ runner.os }}-

      - name: List simulators (for diagnostics)
        run: xcrun simctl list devices available | head -50

      - name: xcodebuild build
        run: |
          set -o pipefail
          xcodebuild \
            -project CareCircle.xcodeproj \
            -scheme "${SCHEME}" \
            -destination "${DESTINATION}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
