version: 2

updates:
  # Backend — Node / pnpm workspace.
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "backend"
    reviewers:
      - "jwillz7667"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      backend-prod:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      backend-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "jwillz7667"
    commit-message:
      prefix: "chore(ci)"

  # Docker base images used in backend / CI.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "jwillz7667"
    commit-message:
      prefix: "chore(docker)"
