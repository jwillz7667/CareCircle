services:
  postgres:
    image: postgres:16-alpine
    container_name: cc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carecircle
      POSTGRES_PASSWORD: carecircle
      POSTGRES_DB: carecircle
    command:
      - postgres
      - -c
      - ssl=off
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=ddl
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carecircle -d carecircle"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - cc-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cc-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - cc-redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: cc-minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: carecircle-minio
      MINIO_ROOT_PASSWORD: carecircle-minio-secret-please-rotate
    ports:
      - "9100:9000"
      - "9101:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - cc-minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 carecircle-minio carecircle-minio-secret-please-rotate &&
      mc mb --ignore-existing local/cc-photos local/cc-voice local/cc-documents local/cc-pdf-exports local/cc-backups &&
      mc version enable local/cc-documents &&
      mc version enable local/cc-photos &&
      mc version enable local/cc-voice &&
      echo 'MinIO buckets ready';
      exit 0;
      "

volumes:
  cc-pg-data:
  cc-redis-data:
  cc-minio-data:
